<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Video Player</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #000;
    font-family: 'Roboto', sans-serif;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

.player-container {
    width: 100%;
    max-width: 1200px;
    background: #000;
    position: relative;
    aspect-ratio: 16/9;
    overflow: hidden;
}

video {
    width: 100%;
    height: 100%;
    display: block;
    cursor: pointer;
}

/* Top Logo */
.top-logo {
    position: absolute;
    top: 15px;
    left: 15px;
    z-index: 100;
}

.logo-img {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid rgba(255, 255, 255, 0.3);
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
}

/* Bottom Watermark */
.bottom-watermark {
    position: absolute;
    bottom: 20px;
    right: 20px;
    color: rgba(255, 255, 255, 0.7);
    font-size: 18px;
    font-weight: bold;
    text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.8);
    z-index: 10;
    pointer-events: none;
}

/* Action Buttons (Rotate, Download, Share) */
.action-buttons {
    position: absolute;
    top: 15px;
    right: 15px;
    display: flex;
    gap: 10px;
    z-index: 100;
}

.action-btn {
    background: rgba(0, 0, 0, 0.6);
    border: none;
    border-radius: 50%;
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.3s;
    opacity: 1;
}

.action-btn:hover {
    background: rgba(255, 255, 255, 0.2);
    transform: scale(1.1);
}

.action-btn svg {
    width: 22px;
    height: 22px;
    fill: #fff;
}

/* Rotate Button States */
.rotate-0 { transform: rotate(0deg); }
.rotate-90 { transform: rotate(90deg); }
.rotate-180 { transform: rotate(180deg); }
.rotate-270 { transform: rotate(270deg); }

/* Ads Overlay */
.ad-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #000;
    z-index: 200;
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

.ad-overlay.active {
    display: flex;
}

.ad-video {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

.ad-info {
    position: absolute;
    top: 20px;
    left: 20px;
    color: white;
    background: rgba(0, 0, 0, 0.7);
    padding: 8px 15px;
    border-radius: 20px;
    font-size: 14px;
    z-index: 201;
}

.ad-skip-button {
    position: absolute;
    bottom: 30px;
    right: 30px;
    background: rgba(0, 0, 0, 0.8);
    color: white;
    border: 2px solid white;
    padding: 10px 25px;
    border-radius: 25px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    z-index: 201;
    transition: all 0.3s;
    opacity: 0;
    pointer-events: none;
}

.ad-skip-button.show {
    opacity: 1;
    pointer-events: auto;
}

.ad-skip-button:hover {
    background: rgba(255, 255, 255, 0.9);
    color: #000;
}

.ad-timer {
    position: absolute;
    top: 20px;
    right: 20px;
    color: white;
    background: rgba(0, 0, 0, 0.7);
    padding: 8px 15px;
    border-radius: 20px;
    font-size: 14px;
    z-index: 201;
}

.ad-link {
    position: absolute;
    bottom: 30px;
    left: 30px;
    background: rgba(0, 174, 255, 0.9);
    color: white;
    border: none;
    padding: 10px 25px;
    border-radius: 25px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    z-index: 201;
    text-decoration: none;
    transition: all 0.3s;
}

.ad-link:hover {
    background: rgba(0, 210, 255, 1);
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(0, 174, 255, 0.4);
}

/* Controls Container */
.controls-container {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
    padding: 10px;
    opacity: 0;
    transition: opacity 0.3s;
    z-index: 50;
}

.player-container:hover .controls-container,
.player-container.paused .controls-container,
.player-container.show-controls .controls-container {
    opacity: 1;
}

/* Progress Bar */
.progress-bar {
    width: 100%;
    height: 4px;
    background: rgba(255,255,255,0.2);
    margin-bottom: 10px;
    cursor: pointer;
    position: relative;
}

.progress {
    height: 100%;
    background: #ff0000;
    width: 0%;
    position: relative;
}

.progress-thumb {
    position: absolute;
    right: -6px;
    top: 50%;
    transform: translateY(-50%);
    width: 12px;
    height: 12px;
    background: #ff0000;
    border-radius: 50%;
    opacity: 0;
    transition: opacity 0.2s;
}

.progress-bar:hover .progress-thumb {
    opacity: 1;
}

.buffered {
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    background: rgba(255,255,255,0.4);
    width: 0%;
}

/* Controls */
.controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 5px;
}

.left-controls, .right-controls {
    display: flex;
    align-items: center;
    gap: 15px;
}

.control-btn {
    background: none;
    border: none;
    color: #fff;
    cursor: pointer;
    padding: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
}

.control-btn svg {
    width: 24px;
    height: 24px;
    fill: currentColor;
}

.control-btn:hover {
    color: #ccc;
}

/* Play/Pause Button - Single Button with Changing Icon */
.play-icon { display: block; }
.pause-icon { display: none; }
.player-container:not(.paused) .play-icon { display: none; }
.player-container:not(.paused) .pause-icon { display: block; }

/* Mute/Unmute Button - Single Button with Changing Icon */
.mute-icon { display: block; }
.unmute-icon { display: none; }
.player-container.muted .mute-icon { display: none; }
.player-container.muted .unmute-icon { display: block; }

/* Fullscreen Button - Single Button with Changing Icon */
.fullscreen-icon { display: block; }
.exit-fullscreen-icon { display: none; }
.player-container.fullscreen .fullscreen-icon { display: none; }
.player-container.fullscreen .exit-fullscreen-icon { display: block; }

/* Time Display - YouTube Style */
.time-display {
    color: #fff;
    font-size: 14px;
    font-family: 'Roboto', monospace;
    display: flex;
    align-items: center;
    gap: 5px;
}

.time-display .current-time {
    color: #fff;
}

.time-display .duration {
    color: rgba(255, 255, 255, 0.7);
}

.time-display .separator {
    color: rgba(255, 255, 255, 0.5);
}

.volume-container {
    display: flex;
    align-items: center;
    gap: 8px;
}

.volume-slider {
    width: 0;
    opacity: 0;
    transition: all 0.3s;
}

.volume-container:hover .volume-slider {
    width: 60px;
    opacity: 1;
}

.volume-slider {
    -webkit-appearance: none;
    height: 4px;
    background: rgba(255,255,255,0.2);
    border-radius: 2px;
    outline: none;
}

.volume-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px;
    height: 12px;
    background: #fff;
    border-radius: 50%;
    cursor: pointer;
}

/* Speed Button */
.speed-btn {
    background: rgba(255, 255, 255, 0.1);
    border: none;
    color: #fff;
    padding: 6px 12px;
    cursor: pointer;
    font-size: 14px;
    border-radius: 4px;
    min-width: 50px;
    text-align: center;
}

.speed-btn:hover {
    background: rgba(255, 255, 255, 0.2);
}

.speed-options {
    position: absolute;
    bottom: 100%;
    right: 0;
    background: rgba(28,28,28,0.95);
    border-radius: 4px;
    padding: 8px 0;
    min-width: 80px;
    opacity: 0;
    visibility: hidden;
    transition: all 0.2s;
    z-index: 100;
}

.speed-menu:hover .speed-options {
    opacity: 1;
    visibility: visible;
}

.speed-option {
    padding: 8px 16px;
    color: #fff;
    cursor: pointer;
    font-size: 14px;
    text-align: center;
}

.speed-option:hover {
    background: rgba(255,255,255,0.1);
}

.speed-option.active {
    color: #3ea6ff;
}

/* Quality Button */
.quality-btn {
    background: rgba(255, 255, 255, 0.1);
    border: none;
    color: #fff;
    padding: 6px 12px;
    cursor: pointer;
    font-size: 14px;
    border-radius: 4px;
    min-width: 60px;
    text-align: center;
}

.quality-btn:hover {
    background: rgba(255, 255, 255, 0.2);
}

.quality-options {
    position: absolute;
    bottom: 100%;
    right: 0;
    background: rgba(28,28,28,0.95);
    border-radius: 4px;
    padding: 8px 0;
    min-width: 100px;
    opacity: 0;
    visibility: hidden;
    transition: all 0.2s;
    z-index: 100;
}

.quality-menu:hover .quality-options {
    opacity: 1;
    visibility: visible;
}

.quality-option {
    padding: 8px 16px;
    color: #fff;
    cursor: pointer;
    font-size: 14px;
    text-align: center;
    white-space: nowrap;
}

.quality-option:hover {
    background: rgba(255,255,255,0.1);
}

.quality-option.active {
    color: #3ea6ff;
}

/* Seek Notification */
.seek-notification {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.8);
    color: #fff;
    padding: 10px 20px;
    border-radius: 4px;
    font-size: 18px;
    display: flex;
    align-items: center;
    gap: 10px;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    z-index: 40;
}

.seek-notification.show {
    opacity: 1;
}

/* Play/Pause Overlay */
.play-pause-overlay {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 80px;
    height: 80px;
    background: rgba(0,0,0,0.6);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    z-index: 40;
}

.play-pause-overlay.show {
    opacity: 1;
}

.play-pause-overlay svg {
    width: 40px;
    height: 40px;
    fill: #fff;
}

/* Loading Spinner */
.loading-spinner {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 50px;
    height: 50px;
    border: 3px solid rgba(255,255,255,0.1);
    border-top: 3px solid #ff0000;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    display: none;
    z-index: 30;
}

@keyframes spin {
    0% { transform: translate(-50%, -50%) rotate(0deg); }
    100% { transform: translate(-50%, -50%) rotate(360deg); }
}

/* Double Tap Areas */
.double-tap-area {
    position: absolute;
    top: 0;
    height: 100%;
    width: 33%;
    z-index: 25;
    pointer-events: auto;
}

.double-tap-left {
    left: 0;
}

.double-tap-center {
    left: 33%;
    width: 34%;
}

.double-tap-right {
    right: 0;
}

/* Mobile Responsive */
@media (max-width: 768px) {
    .player-container {
        max-width: 100%;
        height: auto;
    }
    
    .volume-slider {
        width: 50px !important;
        opacity: 1 !important;
    }
    
    .time-display {
        min-width: 100px;
        font-size: 12px;
    }
    
    .control-btn svg {
        width: 20px;
        height: 20px;
    }
    
    .bottom-watermark {
        bottom: 15px;
        right: 15px;
        font-size: 14px;
    }
    
    .logo-img {
        width: 35px;
        height: 35px;
    }
    
    .action-buttons {
        top: 10px;
        right: 10px;
    }
    
    .action-btn {
        width: 35px;
        height: 35px;
    }
    
    .action-btn svg {
        width: 18px;
        height: 18px;
    }
    
    .speed-btn, .quality-btn {
        padding: 4px 8px;
        font-size: 12px;
        min-width: 45px;
    }
    
    .left-controls, .right-controls {
        gap: 10px;
    }
    
    .ad-skip-button {
        bottom: 20px;
        right: 20px;
        padding: 8px 20px;
        font-size: 14px;
    }
    
    .ad-link {
        bottom: 20px;
        left: 20px;
        padding: 8px 20px;
        font-size: 14px;
    }
}

/* Hide controls on mobile when not interacting */
@media (hover: none) and (pointer: coarse) {
    .controls-container {
        opacity: 1;
        transition: opacity 0.5s;
    }
    
    .player-container:not(.show-controls):not(.paused) .controls-container {
        opacity: 0;
    }
}
</style>
</head>
<body>
<div class="player-container" id="playerContainer">
    <!-- Main Video -->
    <video id="video"></video>
    
    <!-- Double Tap Areas -->
    <div class="double-tap-area double-tap-left" id="doubleTapLeft"></div>
    <div class="double-tap-area double-tap-center" id="doubleTapCenter"></div>
    <div class="double-tap-area double-tap-right" id="doubleTapRight"></div>
    
    <!-- Top Left Logo -->
    <div class="top-logo">
        <img class="logo-img" id="logoImage" src="https://i.ibb.co/992hqrvw/file-0000000083c072069007687f4f4c6769.png" alt="Logo">
    </div>
    
    <!-- Bottom Right Watermark -->
    <div class="bottom-watermark" id="watermark">JASWANT</div>
    
    <!-- Action Buttons -->
    <div class="action-buttons">
        <button class="action-btn" id="rotateBtn" title="Rotate Screen">
            <svg id="rotateIcon" viewBox="0 0 24 24">
                <path d="M7.47 21.49C4.2 19.93 1.86 16.76 1.5 13H0c.5 6.16 5.66 11 11.95 11 .23 0 .44-.02.66-.03L8.8 20.15l-1.33 1.34zM12.05 0c-.23 0-.44.02-.66.04l3.81 3.81 1.33-1.33C19.8 4.07 22.14 7.24 22.5 11H24c-.5-6.16-5.66-11-11.95-11zM16 14h2V8a2 2 0 0 0-2-2h-6v2h6v6zm-8 0V4H6v2H4v2h2v8a2 2 0 0 0 2 2h8v2h2v-2h2v-2H8z"/>
            </svg>
        </button>
        
        <button class="action-btn" id="downloadBtn" title="Download Video">
            <svg viewBox="0 0 24 24">
                <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
            </svg>
        </button>
        
        <button class="action-btn" id="shareBtn" title="Share Video">
            <svg viewBox="0 0 24 24">
                <path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/>
            </svg>
        </button>
    </div>
    
    <!-- Ads Overlay -->
    <div class="ad-overlay" id="adOverlay">
        <video class="ad-video" id="adVideo" preload="auto"></video>
        <div class="ad-info" id="adInfo">Advertisement</div>
        <div class="ad-timer" id="adTimer">Skip in 5s</div>
        <button class="ad-skip-button" id="adSkipButton">Skip Ad</button>
        <a class="ad-link" id="adLink" target="_blank">Visit Website</a>
    </div>
    
    <!-- Loading Spinner -->
    <div class="loading-spinner" id="loadingSpinner"></div>
    
    <!-- Play/Pause Overlay -->
    <div class="play-pause-overlay" id="playPauseOverlay">
        <svg class="play-overlay-icon"><use href="#icon-pause"></use></svg>
    </div>
    
    <!-- Seek Notification -->
    <div class="seek-notification" id="seekNotification">
        <svg id="seekIcon"><use href="#icon-rewind"></use></svg>
        <span id="seekText">10s</span>
    </div>
    
    <!-- Controls Container -->
    <div class="controls-container" id="controlsContainer">
        <div class="progress-bar" id="progressBar">
            <div class="buffered" id="buffered"></div>
            <div class="progress" id="progress">
                <div class="progress-thumb"></div>
            </div>
        </div>
        
        <div class="controls">
            <div class="left-controls">
                <!-- Single Play/Pause Button -->
                <button class="control-btn" id="playPauseBtn" title="Play/Pause">
                    <svg class="play-icon"><use href="#icon-play"></use></svg>
                    <svg class="pause-icon"><use href="#icon-pause"></use></svg>
                </button>
                
                <!-- 10s Rewind Button -->
                <button class="control-btn" id="rewindBtn" title="Rewind 10s">
                    <svg><use href="#icon-rewind"></use></svg>
                </button>
                
                <!-- 10s Forward Button -->
                <button class="control-btn" id="forwardBtn" title="Forward 10s">
                    <svg><use href="#icon-forward"></use></svg>
                </button>
                
                <!-- Single Mute/Unmute Button -->
                <div class="volume-container">
                    <button class="control-btn" id="muteBtn" title="Mute/Unmute">
                        <svg class="mute-icon"><use href="#icon-mute"></use></svg>
                        <svg class="unmute-icon"><use href="#icon-unmute"></use></svg>
                    </button>
                    <input class="volume-slider" id="volumeSlider" type="range" min="0" max="1" step="0.01" value="1">
                </div>
                
                <!-- YouTube Style Time Display -->
                <div class="time-display">
                    <span class="current-time" id="currentTime">0:00</span>
                    <span class="separator">/</span>
                    <span class="duration" id="duration">0:00</span>
                </div>
            </div>
            
            <div class="right-controls">
                <!-- Quality Button with Menu -->
                <div class="quality-menu">
                    <button class="quality-btn" id="qualityBtn">Auto</button>
                    <div class="quality-options" id="qualityOptions">
                        <div class="quality-option" data-quality="auto">Auto</div>
                    </div>
                </div>
                
                <!-- Speed Button with Menu -->
                <div class="speed-menu">
                    <button class="speed-btn" id="speedBtn">1x</button>
                    <div class="speed-options" id="speedOptions">
                        <div class="speed-option" data-speed="0.25">0.25x</div>
                        <div class="speed-option" data-speed="0.5">0.5x</div>
                        <div class="speed-option active" data-speed="1">1x</div>
                        <div class="speed-option" data-speed="1.25">1.25x</div>
                        <div class="speed-option" data-speed="1.5">1.5x</div>
                        <div class="speed-option" data-speed="2">2x</div>
                    </div>
                </div>
                
                <!-- Single Fullscreen Button -->
                <button class="control-btn" id="fullscreenBtn" title="Fullscreen">
                    <svg class="fullscreen-icon"><use href="#icon-fullscreen"></use></svg>
                    <svg class="exit-fullscreen-icon"><use href="#icon-exit-fullscreen"></use></svg>
                </button>
            </div>
        </div>
    </div>
</div>

<svg style="display: none;">
    <symbol id="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></symbol>
    <symbol id="icon-pause" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></symbol>
    <symbol id="icon-rewind" viewBox="0 0 24 24"><path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z"/></symbol>
    <symbol id="icon-forward" viewBox="0 0 24 24"><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></symbol>
    <symbol id="icon-fullscreen" viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></symbol>
    <symbol id="icon-exit-fullscreen" viewBox="0 0 24 24"><path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/></symbol>
    <symbol id="icon-mute" viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></symbol>
    <symbol id="icon-unmute" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></symbol>

<script>

    // Parse date from DD-MM-YYYY format
    function parseDate(dateStr) {
        const parts = dateStr.split('-');
        if (parts.length === 3) {
            return new Date(parts[2], parts[1] - 1, parts[0]);
        }
        return new Date(); // Return today if invalid
    }
    
    // Parse time range (e.g., "10-45" means 10min 45sec)
    function parseTimeRange(timeStr) {
        if (!timeStr) return { min: 0, max: Infinity };
        
        if (timeStr.includes('-')) {
            const parts = timeStr.split('-');
            const start = parseTimeToSeconds(parts[0]);
            const end = parseTimeToSeconds(parts[1]);
            return { min: start, max: end };
        }
        
        const time = parseTimeToSeconds(timeStr);
        return { min: time, max: time + 5 }; // 5 second window
    }
    
    // Parse time like "10" (seconds) or "1:30" (min:sec) or "1:30:45" (hr:min:sec)
    function parseTimeToSeconds(timeStr) {
        if (!timeStr) return 0;
        
        // Check if it's just seconds
        if (!isNaN(timeStr) && !timeStr.includes(':')) {
            return parseInt(timeStr);
        }
        
        // Parse HH:MM:SS or MM:SS
        const parts = timeStr.split(':').map(Number);
        if (parts.length === 3) {
            return parts[0] * 3600 + parts[1] * 60 + parts[2];
        } else if (parts.length === 2) {
            return parts[0] * 60 + parts[1];
        } else if (parts.length === 1) {
            return parts[0];
        }
        
        return 0;
    }
    
    // Check if ad should be shown - COMPLETELY FIXED
    function shouldShowAd(currentTime) {
        if (!adsData.length || isShowingAd || !video.duration) return false;
        
        // Check if any ad should show at this time
        for (const ad of adsData) {
            const adId = ad.url; // Use URL as unique ID
            
            // Skip if already shown
            if (shownAdIds.has(adId)) continue;
            
            // Check app
            if (ad.app !== 'All' && ad.app !== appName) continue;
            
            // Parse time range
            const timeRange = parseTimeRange(ad.time);
            
            // Check if current time is within ad time range
            if (currentTime >= timeRange.min && currentTime <= timeRange.max) {
                return ad;
            }
        }
        
        return false;
    }
    
    // Show ad - COMPLETELY FIXED
    function showAd(ad) {
        console.log('Showing ad:', ad);
        
        if (!ad || !ad.url || isShowingAd) return;
        
        currentAd = ad;
        isShowingAd = true;
        adDuration = parseInt(ad.duration) || 20;
        adRemainingTime = adDuration;
        
        // Mark ad as shown
        shownAdIds.add(ad.url);
        
        // Pause main video
        const wasPlaying = !video.paused;
        video.pause();
        
        // Show ad overlay
        adOverlay.classList.add('active');
        
        // Set ad link
        adLink.href = ad.link || '#';
        adLink.textContent = 'Visit Website';
        
        // Update ad info
        adInfo.textContent = 'Advertisement';
        
        // Load ad video
        loadAdVideo(ad.url);
        
        // Start ad timer
        startAdTimer();
        
        // Hide skip button initially
        adSkipButton.classList.remove('show');
        
        // Show skip button after duration
        clearTimeout(adSkipTimeout);
        adSkipTimeout = setTimeout(() => {
            adSkipButton.classList.add('show');
        }, adDuration * 1000);
        
        // Auto-end after ad.end seconds
        clearTimeout(adEndTimeout);
        if (ad.end) {
            const endTime = parseInt(ad.end) || 60;
            adEndTimeout = setTimeout(() => {
                console.log('Ad auto-ending after', endTime, 'seconds');
                skipAd();
            }, endTime * 1000);
        }
    }
    
    // Load ad video
    function loadAdVideo(url) {
        console.log('Loading ad video:', url);
        
        // Clean up previous HLS
        if (adHls) {
            adHls.destroy();
            adHls = null;
        }
        
        // Reset ad video
        adVideo.pause();
        adVideo.src = '';
        
        if (Hls.isSupported()) {
            adHls = new Hls({
                enableWorker: false,
                lowLatencyMode: true,
                maxBufferLength: 10
            });
            
            adHls.loadSource(url);
            adHls.attachMedia(adVideo);
            
            adHls.on(Hls.Events.MANIFEST_PARSED, () => {
                console.log('Ad manifest parsed');
                adVideo.play().catch(e => {
                    console.log('Ad autoplay blocked:', e);

                    setTimeout(() => {

            adHls.on(Hls.Events.ERROR, (event, data) => {

            adVideo.src = url;
            adVideo.play().catch(() => {

    // Start ad timer
    function startAdTimer() {
        updateAdTimer();
        clearInterval(adTimerInterval);
        adTimerInterval = setInterval(() => {
            adRemainingTime--;

    // Skip ad - COMPLETELY FIXED

        // Clear all ad timers

        clearTimeout(adSkipTimeout);

        // Destroy HLS

    // Double Tap Areas
    function setupDoubleTapArea(area, action) {
        let lastTap = 0;
        
        area.addEventListener('touchstart', function(e) {
            const currentTime = Date.now();
            const tapLength = currentTime - lastTap;
            
            if (tapLength < 300 && tapLength > 0) {
                e.preventDefault();
                e.stopPropagation();
                action();
                lastTap = 0;
            } else {
                lastTap = currentTime;
            }
        });
        
        area.addEventListener('dblclick', function(e) {
            e.preventDefault();
            e.stopPropagation();
            action();
        });
    }
    
    setupDoubleTapArea(doubleTapLeft, () => seek(-10));

    // Video click
    video.addEventListener('click', function(e) {
        if (isShowingAd) return;

    });
    
    // Seek function
    function seek(seconds) {
        if (isShowingAd) return;
        
        const newTime = video.currentTime + seconds;
        video.currentTime = Math.max(0, Math.min(newTime, video.duration));
        
        seekText.textContent = Math.abs(seconds) + 's';

    // Keyboard shortcuts
    document.addEventListener('keydown', function(e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'BUTTON' || isShowingAd) return;
        
        switch(e.key.toLowerCase()) {
            case ' ':
            case 'k':
                e.preventDefault();
                togglePlayPause();
                break;
            case 'arrowleft':
                e.preventDefault();
                seek(-5);
                break;
            case 'arrowright':
                e.preventDefault();
                seek(5);
                break;
            case 'arrowup':
                e.preventDefault();

            case 'f':

            case 'm':

                break;
        }

    // Volume

        showControlsTemporarily();

    // Time display - FIXED ad checking

        const current = formatTime(video.currentTime);
        const duration = formatTime(video.duration);
        
        currentTimeEl.textContent = current;
        durationEl.textContent = duration;
        
        // Check for ads
        if (!isShowingAd && video.duration > 0) {
            const ad = shouldShowAd(video.currentTime);
            if (ad) {
                console.log('Time for ad at', video.currentTime, 'seconds');
                showAd(ad);
            }
        }
    }
    
    function formatTime(seconds) {
        if (isNaN(seconds)) return '0:00';
        const hours = Math.floor(seconds / 3600);
        const mins = Math.floor((seconds % 3600) / 60);
        const secs = Math.floor(seconds % 60);
        
        if (hours > 0) {
            return `${hours}:${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        } else {
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }
    }
    
    // Progress bar
    function updateProgress() {
        if (video.duration) {
            const percent = (video.currentTime / video.duration) * 100;
            progress.style.width = percent + '%';

    }
    
    function updateBuffered() {
        if (video.buffered.length > 0 && video.duration > 0) {
            const bufferedEnd = video.buffered.end(video.buffered.length - 1);
            const percent = (bufferedEnd / video.duration) * 100;
            buffered.style.width = percent + '%';
        }
    }
    
    progressBar.addEventListener('click', function(e) {
        if (isShowingAd) return;
        const rect = this.getBoundingClientRect();
        const percent = (e.clientX - rect.left) / rect.width;
        video.currentTime = percent * video.duration;
        showControlsTemporarily();
    });

        if (screen.orientation && screen.orientation.lock) {
            if (currentRotation === 90 || currentRotation === 270) {

            } else {
                screen.orientation.lock('portrait').catch(() => {});
            }
        }
        
        showControlsTemporarily();

        // Create download URL

        // Convert HLS to downloadable format if needed
        if (videoUrl.includes('.m3u8')) {
            // Use qooly service for HLS conversion
            downloadUrl = `https://qooly.com/d/?query=${encodeURIComponent(videoUrl)}`;
        }
        
        // Open download link

        showControlsTemporarily();

    // Share button

        if (isShowingAd) return;
        
        // Create share URL
        const shareUrl = `https://puly-star.vercel.app/?video=${encodeURIComponent(videoUrl)}&name=${encodeURIComponent(videoTitle)}&app=${appName}`;
        
        // Copy to clipboard
        navigator.clipboard.writeText(shareUrl).then(() => {
            alert('Video link copied to clipboard!');
        }).catch(() => {
            // Fallback
            const tempInput = document.createElement('input');
            tempInput.value = shareUrl;
            document.body.appendChild(tempInput);
            tempInput.select();

    function toggleFullscreen() {
        if (!document.fullscreenElement) {
            if (playerContainer.requestFullscreen) {
                playerContainer.requestFullscreen();
            } else if (playerContainer.webkitRequestFullscreen) {
                playerContainer.webkitRequestFullscreen();
            } else if (playerContainer.msRequestFullscreen) {
                playerContainer.msRequestFullscreen();
            }
        } else {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            } else if (document.webkitExitFullscreen) {
                document.webkitExitFullscreen();
            } else if (document.msExitFullscreen) {
                document.msExitFullscreen();
            }
        }
        showControlsTemporarily();
    }
    
    document.addEventListener('fullscreenchange', updateFullscreenButton);
    document.addEventListener('webkitfullscreenchange', updateFullscreenButton);
    document.addEventListener('mozfullscreenchange', updateFullscreenButton);
    
    function updateFullscreenButton() {
        const isFullscreen = !!document.fullscreenElement || 
                            !!document.webkitFullscreenElement || 
                            !!document.mozFullScreenElement;
        playerContainer.classList.toggle('fullscreen', isFullscreen);
    }
    
    // Ad events
    adVideo.addEventListener('ended', function() {
        console.log('Ad video ended naturally');
        skipAd();
    });
    
    adSkipButton.addEventListener('click', skipAd);
    
    // Show play/pause overlay
    function showPlayPauseOverlay() {
        playPauseOverlay.classList.add('show');
        setTimeout(() => {
            playPauseOverlay.classList.remove('show');
        }, 300);
    }
    
    // Show controls temporarily
    function showControlsTemporarily() {
        if (isShowingAd) return;
        
        playerContainer.classList.add('show-controls');
        clearTimeout(controlsTimeout);
        
        // Hide after 3 seconds if not paused
        if (!video.paused) {
            controlsTimeout = setTimeout(() => {
                playerContainer.classList.remove('show-controls');
            }, 3000);
        }
    }
    
    // Hide controls on inactivity
    playerContainer.addEventListener('mousemove', showControlsTemporarily);
    playerContainer.addEventListener('touchstart', showControlsTemporarily);
    
    // Event listeners
    video.addEventListener('timeupdate', function() {
        updateTimeDisplay();
        updateProgress();
    });
    
    video.addEventListener('progress', updateBuffered);
    video.addEventListener('loadedmetadata', updateTimeDisplay);
    
    video.addEventListener('waiting', function() {
        loadingSpinner.style.display = 'block';
    });
    
    video.addEventListener('playing', function() {
        loadingSpinner.style.display = 'none';
    });
    
    // Initial setup
    updateMuteButton();
    updateFullscreenButton();
    
    // Auto-hide controls after 3 seconds
    setTimeout(() => {
        if (!video.paused) {
            playerContainer.classList.remove('show-controls');
        }
    }, 3000);
});
</script>
</body>
</html>
